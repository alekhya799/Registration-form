<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            margin: 0;
            padding: 40px 0;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px greenyellow;
        }

        h1 {
            text-align: center;
            color: purple;
            text-transform: uppercase;
            font-size: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: rgb(207, 34, 190);
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid hwb(80 49% 4%);
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #c115c1;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #6ec7af;
            color: whitesmoke;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #c74f83;
        }
#msg {
    margin-top: 20px;
    padding: 20px;
    background: linear-gradient( #e345c4);
    color:lavender;
    border-radius: 12px;
    line-height: 2;
    font-size: 16px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);

}

        #result {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Registration Form</h1>

    <label>Name:</label>
    <input type="text" id="but">

    <label>Phone Number:</label>
    <input type="text" id="cse">

    <label>Email:</label>
    <input type="text" id="swe">

    <label>Address:</label>
    <input type="text" id="thi">

    <label>Age:</label>
    <input type="number" id="amm">

    <label>Marks:</label>
    <input type="number" id="sp" min="0" max="100">

    <button onclick="on()">Submit</button>

    <div id="msg"></div>
    <div id="result"></div>

</div>

<script>

    let ans = document.getElementById("but");
    let s = document.getElementById("cse");
    let e = document.getElementById("swe");
    let b = document.getElementById("thi");
    let a = document.getElementById("amm");
    let r = document.getElementById("sp");

    function on() {

        let marks = Number(r.value);

        // Check marks
        if (r.value === "") {
            alert("Please enter marks");
            return;
        }

        if (marks < 0 || marks > 100) {
            alert("Please enter marks between 0 and 100");
            return;
        }

        // Display student details
        document.getElementById("msg").innerHTML =
            "<b>Name:</b> " + ans.value + "<br>" +
            "<b>Phone Number:</b> " + s.value + "<br>" +
            "<b>Email:</b> " + e.value + "<br>" +
            "<b>Address:</b> " + b.value + "<br>" +
            "<b>Age:</b> " + a.value + "<br>" +
            "<b>Marks:</b> " + marks;

        // Pass or Fail
        if (marks >= 35) {
            document.getElementById("result").innerHTML = "PASSED ✓";
            document.getElementById("result").style.color = "green";
            alert("Congratulations! You Passed.");
        } else {
            document.getElementById("result").innerHTML = "FAILED ✗";
            document.getElementById("result").style.color = "pink";
            alert("Sorry! You Failed.");
        }
    }

</script>

</body>
</html>
